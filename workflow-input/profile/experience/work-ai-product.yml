      - 跨团队协作
    evidence_level: confirmed
    include_in_cv: true
  - id: work-ai-product-knowledge
    title: 知识库和上线材料维护
    content: 与内容负责人共同维护约 36 篇帮助文章及 FAQ，按季度复核更新日期、功能截图和负责人；产品变更时检查受影响页面，上线后回填已确认的解决方式。
    familiarity: 4
    role_tags:
