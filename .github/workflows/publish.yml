name: Publish career-ops workflow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap repository
        uses: actions/checkout@v4

      - name: Build the published tree from the upstream release
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/career-ops-base"
          git clone https://github.com/santifer/career-ops.git "$base"
          git -C "$base" fetch --depth=1 origin fdda56138988873022bf0e1b42baa1fdef665494
          git -C "$base" checkout --detach fdda56138988873022bf0e1b42baa1fdef665494
          git -C "$base" apply --binary "$GITHUB_WORKSPACE/career-ops-workflow.patch"
          cp "$GITHUB_WORKSPACE/career-ops-bootstrap.yml" "$RUNNER_TEMP/career-ops-bootstrap.yml"

          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'career-ops-workflow.patch' \
            --exclude 'career-ops-bootstrap.yml' \
            "$base/" "$GITHUB_WORKSPACE/"

          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          cp "$RUNNER_TEMP/career-ops-bootstrap.yml" "$GITHUB_WORKSPACE/.github/workflows/publish.yml"
          rm -f "$GITHUB_WORKSPACE/career-ops-workflow.patch" "$GITHUB_WORKSPACE/career-ops-bootstrap.yml"

      - name: Commit the published tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish career-ops workflow" || exit 0
          git push

